name: Flask CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate code
      run: |
        python -m py_compile manage.py
        echo "Code validation successful"

    - name: Initialize SQLite database
      run: |
        python manage.py db upgrade
        echo "Database initialized successfully"

    - name: Start Flask server
      run: |
        python manage.py runserver &
        echo \$! > flask.pid
        sleep 5

    - name: Smoke test Flask server
      run: |
        echo "Testing Flask server on port 7345..."
        curl -f http://localhost:7345/ || exit 1
        echo "Smoke test passed! Server is responding."

    - name: Stop Flask server
      if: always()
      run: |
        if [ -f flask.pid ]; then
          kill \$(cat flask.pid) || true
          rm flask.pid
        fi
